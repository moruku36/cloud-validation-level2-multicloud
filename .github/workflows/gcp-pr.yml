name: GCP Terraform PR

on:
  pull_request:
    paths:
      - "gcp/**"
      - ".github/workflows/gcp-*.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: gcp

concurrency:
  group: gcp-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (GCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  cloud-plan:
    name: Cloud plan (GCP)
    needs: static-checks
    if: >-
      vars.GCP_ENVIRONMENT_ACTIVE == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PR_SA_EMAIL }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: Copy-Item backend.tf.example backend.tf
        shell: pwsh
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.GCP_STATE_BUCKET }}"
          -backend-config="prefix=${{ secrets.GCP_STATE_PREFIX }}"
      - run: terraform plan -input=false -lock=false -no-color
